services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: obsync
      POSTGRES_USER: obsync
      POSTGRES_PASSWORD: ${OBSYNC_POSTGRES_PASSWORD:?Set OBSYNC_POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obsync -d obsync"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  obsync-server:
    build:
      context: ./server
    image: obsync-server:1.7.4
    restart: unless-stopped
    environment:
      NODE_ENV: production
      OBSYNC_POSTGRES_HOST: postgres
      OBSYNC_POSTGRES_PORT: 5432
      OBSYNC_POSTGRES_DB: obsync
      OBSYNC_POSTGRES_USER: obsync
      OBSYNC_POSTGRES_PASSWORD: ${OBSYNC_POSTGRES_PASSWORD:?Set OBSYNC_POSTGRES_PASSWORD in .env}
      OBSYNC_AUTH_TOKEN: ${OBSYNC_AUTH_TOKEN:?Set OBSYNC_AUTH_TOKEN in .env}
      OBSYNC_HOST: 0.0.0.0
      OBSYNC_PORT: 4444
      OBSYNC_DATA_DIR: /data
      OBSYNC_ALLOWED_ORIGINS: ${OBSYNC_ALLOWED_ORIGINS:-}
      OBSYNC_STORAGE_QUOTA_BYTES: ${OBSYNC_STORAGE_QUOTA_BYTES:-0}
      OBSYNC_MAX_HTTP_CONNECTIONS: ${OBSYNC_MAX_HTTP_CONNECTIONS:-1024}
      OBSYNC_MAX_WS_SESSIONS: ${OBSYNC_MAX_WS_SESSIONS:-256}
      OBSYNC_S3_ENDPOINT: ${OBSYNC_S3_ENDPOINT:-}
      OBSYNC_S3_REGION: ${OBSYNC_S3_REGION:-}
      OBSYNC_S3_BUCKET: ${OBSYNC_S3_BUCKET:-}
      OBSYNC_S3_ACCESS_KEY_ID: ${OBSYNC_S3_ACCESS_KEY_ID:-}
      OBSYNC_S3_SECRET_ACCESS_KEY: ${OBSYNC_S3_SECRET_ACCESS_KEY:-}
      OBSYNC_S3_FORCE_PATH_STYLE: ${OBSYNC_S3_FORCE_PATH_STYLE:-true}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4444/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:${OBSYNC_PORT:-4444}:4444"
    volumes:
      - obsync-data:/data

volumes:
  postgres-data:
  obsync-data:
