services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: obsync
      POSTGRES_USER: obsync
      POSTGRES_PASSWORD: ${OBSYNC_POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obsync -d obsync"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  obsync-server:
    build:
      context: ./server
    image: obsync-server:1.6.8
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://obsync:${OBSYNC_POSTGRES_PASSWORD}@postgres:5432/obsync
      OBSYNC_AUTH_TOKEN: ${OBSYNC_AUTH_TOKEN}
      OBSYNC_HOST: 0.0.0.0
      OBSYNC_PORT: 4444
      OBSYNC_DATA_DIR: /data
      OBSYNC_ENABLE_WEB_ROUTES: "false"
      OBSYNC_STORAGE_QUOTA_BYTES: ${OBSYNC_STORAGE_QUOTA_BYTES:-0}
      OBSYNC_S3_ENDPOINT: ${OBSYNC_S3_ENDPOINT:-}
      OBSYNC_S3_REGION: ${OBSYNC_S3_REGION:-}
      OBSYNC_S3_BUCKET: ${OBSYNC_S3_BUCKET:-}
      OBSYNC_S3_ACCESS_KEY_ID: ${OBSYNC_S3_ACCESS_KEY_ID:-}
      OBSYNC_S3_SECRET_ACCESS_KEY: ${OBSYNC_S3_SECRET_ACCESS_KEY:-}
      OBSYNC_S3_FORCE_PATH_STYLE: ${OBSYNC_S3_FORCE_PATH_STYLE:-true}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4444/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "${OBSYNC_PORT:-4444}:4444"
    volumes:
      - obsync-data:/data

volumes:
  postgres-data:
  obsync-data:
